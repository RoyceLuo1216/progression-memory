name: qa-benchmarks

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/progression_memory/evaluation/qa.py'
      - 'src/progression_memory/benchmarks/qa_benchmark.py'
      - 'src/progression_memory/evaluation/hierarchical_retrieval.py'
      - 'src/progression_memory/benchmarks/real_retrieval.py'
      - 'tests/test_qa.py'
      - '.github/workflows/qa-benchmarks.yml'

jobs:
  qa-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest -q
      - name: Download public benchmarks
        run: |
          mkdir -p evaluation/data evaluation/results/qa evaluation/results/qa/hypotheses
          wget -q https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json -O evaluation/data/locomo10.json
          wget -q https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json -O evaluation/data/longmemeval_s_cleaned.json
      - name: Run current architecture QA comparison
        run: |
          for dataset in locomo longmemeval; do
            if [ "$dataset" = locomo ]; then data=evaluation/data/locomo10.json; budget=4800; else data=evaluation/data/longmemeval_s_cleaned.json; budget=100000; fi
            python -m progression_memory.benchmarks.qa_benchmark \
              --dataset "$dataset" --data-path "$data" \
              --systems append,two_stage_v2,dag_two_stage_v2,hierarchical_beam_v2 \
              --char-budget "$budget" --sample-size 180 \
              --reader multi_evidence_extractive --context-strategy flat \
              --hypotheses-dir evaluation/results/qa/hypotheses \
              --output "evaluation/results/qa/${dataset}_hierarchy_v2_flat_multi.json"
            python -m progression_memory.benchmarks.qa_benchmark \
              --dataset "$dataset" --data-path "$data" \
              --systems append,two_stage_v2,dag_two_stage_v2,hierarchical_beam_v2 \
              --char-budget "$budget" --sample-size 180 \
              --reader multi_evidence_extractive --context-strategy evidence_pack \
              --hypotheses-dir evaluation/results/qa/hypotheses \
              --output "evaluation/results/qa/${dataset}_hierarchy_v2_pack_multi.json"
          done
      - name: Print QA summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('evaluation/results/qa').glob('*.json')):
              data=json.loads(path.read_text())
              print(f'=== {path.name} ===')
              for system,result in data['results'].items(): print(system,json.dumps(result['overall'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qa-benchmark-results
          path: |
            evaluation/results/qa/*.json
            evaluation/results/qa/hypotheses/*.jsonl

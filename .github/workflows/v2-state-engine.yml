name: V2 State Engine Tests

on:
  push:
    branches: [v2/state-engine]
  pull_request:
    paths:
      - 'src/progression_memory/v2/**'
      - 'tests/test_v2_state_engine.py'
      - '.github/workflows/v2-state-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-state-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: V2 unit tests
        run: python -m pytest -q tests/test_v2_state_engine.py
      - name: Full regression suite
        run: python -m pytest -q
  lint:
    name: V2 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint V2 code and tests
        run: ruff check src/progression_memory/v2 tests/test_v2_state_engine.py

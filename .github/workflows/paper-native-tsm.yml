name: paper-native-tsm

# Runs unmodified TSM source. This is a live paper baseline, not a progression
# comparison. It runs only when manually dispatched with a configured API key.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset to reproduce
        required: true
        type: choice
        options: [locomo, longmemeval]

jobs:
  native-tsm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/tsm-ci-isolated-2026
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q -O - http://localhost:7474 >/dev/null 2>&1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TSM_LLM_BASE_URL: https://api.openai.com/v1
      TSM_EMBEDDING_BASE_URL: https://api.openai.com/v1
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: tsm-ci-isolated-2026
      NEO4J_DATABASE: neo4j
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require model credentials
        run: test -n "$OPENAI_API_KEY" || { echo 'Configure OPENAI_API_KEY repository secret'; exit 1; }
      - name: Prepare original TSM revision
        run: python -m progression_memory.benchmarks.paper_pairs prepare tsm "$RUNNER_TEMP/tsm" --fetch
      - name: Install paper dependencies
        run: python -m pip install -r "$RUNNER_TEMP/tsm/requirements.lock"
      - name: Download pinned official dataset
        run: python "$RUNNER_TEMP/tsm/scripts/download_data.py" "${{ inputs.dataset }}"
      - name: Verify paper configuration
        run: python "$RUNNER_TEMP/tsm/scripts/validate_configs.py"
      - name: Run paper-native baseline
        run: |
          python -m progression_memory.benchmarks.paper_native \
            tsm "${{ inputs.dataset }}" "$RUNNER_TEMP/tsm" \
            --output "$RUNNER_TEMP/native-report" \
            --acknowledge-model-calls
      - name: Archive raw native outputs and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsm-native-${{ inputs.dataset }}
          path: |
            ${{ runner.temp }}/native-report/**
            ${{ runner.temp }}/tsm/runs/**
            ${{ runner.temp }}/tsm/outputs/**
          if-no-files-found: warn

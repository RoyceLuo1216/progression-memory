name: V2 Writer Integration

on:
  push:
    branches: [v2/writer-integration]
  pull_request:
    paths:
      - 'src/progression_memory/v2/**'
      - 'tests/test_v2_*.py'
      - '.github/workflows/v2-writer-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-writer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Writer integration tests
        run: python -m pytest -q tests/test_v2_writer_pipeline.py tests/test_v2_state_engine.py
      - name: Full regression suite
        run: python -m pytest -q
  lint:
    name: V2 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - run: ruff check src/progression_memory/v2 tests/test_v2_writer_pipeline.py

name: MEME Qwen3.5 2B Strong Reader
on:
  push:
    branches: [eval/final-reader-writer-2b]
    paths: [scripts/meme_qwen_2b_reader.py, .github/workflows/meme-2b-reader.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU 2B model runtime
        run: |
          python -m pip install -e . huggingface_hub
          python -m pip install --no-cache-dir -U "transformers>=5.1.0" accelerate pillow torchvision
      - name: MEME 12 historical and 4 cascading decisions, wiki vs compact V2
        run: python -u -m scripts.meme_qwen_2b_reader
        env:
          OMP_NUM_THREADS: "2"
          HF_HUB_DISABLE_XET: "1"
          TOKENIZERS_PARALLELISM: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meme-qwen-2b-reader
          path: results/meme_2b_reader.json

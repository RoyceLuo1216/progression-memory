name: process-writer-benchmark
on:
  workflow_dispatch:
  push:
    branches: [master, codex/process-aware-writer]
    paths:
      - 'src/progression_memory/maintenance/process_writer.py'
      - 'src/progression_memory/maintenance/local_model.py'
      - 'src/progression_memory/maintenance/state.py'
      - 'src/progression_memory/models/progression.py'
      - 'src/progression_memory/evaluation/process_construction.py'
      - 'src/progression_memory/benchmarks/process_writer_benchmark.py'
      - 'src/progression_memory/benchmarks/writer_model_shootout.py'
      - 'src/progression_memory/benchmarks/real_retrieval.py'
      - 'tests/test_process_writer.py'
      - 'pyproject.toml'
      - '.github/workflows/process-writer-benchmark.yml'
concurrency:
  group: process-writer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: process-writer-${{ runner.os }}-qwen2.5-1.5b
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,semantic,slm]'
      - run: pytest -q
      - name: Actual SLM development fixture
        id: fixture
        continue-on-error: true
        run: |
          python -m progression_memory.benchmarks.process_writer_benchmark \
            --dataset fixture --max-turns 4 --enforce-quality \
            --output evaluation/results/process-ci/fixture.json
      - name: Actual SLM LoCoMo construction smoke (8 turns, one conversation)
        if: github.event_name == 'workflow_dispatch' && steps.fixture.outcome == 'success'
        run: |
          mkdir -p evaluation/data
          curl -fL https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json -o evaluation/data/locomo10.json
          python -m progression_memory.benchmarks.real_retrieval --system process_slm \
            --dataset locomo --data-path evaluation/data/locomo10.json \
            --corpus-limit 1 --max-turns 8 --output evaluation/results/process-ci/locomo-smoke.json
      - name: Report experimental model quality
        if: always()
        run: |
          echo "Actual SLM fixture outcome: ${{ steps.fixture.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.fixture.outcome }}" != "success" ]; then
            echo "The model-quality experiment did not meet its gate; deterministic tests remain blocking." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-writer-results
          path: evaluation/results/process-ci/

name: Qwen 3.5 0.8B Real CPU Inference
on:
  push:
    branches: [v2/qwen35-small-model-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qwen_cpu_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Qwen3.5-compatible Transformers
        run: |
          python -m pip install -e .
          python -m pip install --no-cache-dir -U "transformers>=5.1.0" accelerate pillow
          python -c "from transformers import AutoModelForMultimodalLM, AutoProcessor; print('Qwen-compatible Transformers imported')"
      - name: Real local model inference
        env:
          HF_HUB_DISABLE_XET: "1"
          OMP_NUM_THREADS: "2"
        run: python scripts/qwen35_cpu_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen35-cpu-smoke-results
          path: results/qwen35_smoke.json

name: V2 Decision Continuity Pilot
on:
  push:
    branches: [v2/decision-continuity-pilot]
  pull_request:
    paths:
      - 'src/progression_memory/benchmarks/v2_decision_continuity.py'
      - 'tests/test_v2_decision_continuity.py'
      - '.github/workflows/v2-decision-continuity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/progression_memory/benchmarks/v2_decision_continuity.py tests/test_v2_decision_continuity.py
      - run: python -m pytest -q tests/test_v2_decision_continuity.py
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distractors: [2, 8, 16]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m progression_memory.benchmarks.v2_decision_continuity --distractors ${{ matrix.distractors }} --output results/decision_${{ matrix.distractors }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: decision-continuity-${{ matrix.distractors }}
          path: results/decision_${{ matrix.distractors }}.json

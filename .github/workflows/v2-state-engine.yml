name: V2 State Engine Tests
on:
  push:
    branches: [v2/state-engine]
  pull_request:
    paths:
      - 'src/progression_memory/v2/**'
      - 'tests/test_v2_state_engine.py'
      - '.github/workflows/v2-state-engine.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Run V2 tests
        run: python -m pytest -q tests/test_v2_state_engine.py
      - name: Run legacy tests
        run: python -m pytest -q

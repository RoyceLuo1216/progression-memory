name: retrieval-benchmarks

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/progression_memory/evaluation/**'
      - 'src/progression_memory/maintenance/**'
      - 'src/progression_memory/storage/**'
      - 'src/progression_memory/temporal/**'
      - 'src/progression_memory/benchmarks/real_retrieval.py'
      - 'tests/**'
      - '.github/workflows/retrieval-benchmarks.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package with semantic retrieval
        run: pip install -e '.[dev,semantic]'
      - name: Run tests
        run: pytest -q
      - name: Download LoCoMo
        run: |
          mkdir -p evaluation/data evaluation/results/ci
          wget -q https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json -O evaluation/data/locomo10.json
      - name: Benchmark LoCoMo V2 and semantic V3
        run: |
          for system in hierarchical_beam_v2 hierarchical_beam_v3; do
            python -m progression_memory.benchmarks.real_retrieval \
              --dataset locomo \
              --data-path evaluation/data/locomo10.json \
              --system "$system" \
              --top-k 5,8,10 \
              --output "evaluation/results/ci/locomo_${system}.json"
          done
      - name: Print result files
        run: |
          for result in evaluation/results/ci/*.json; do
            echo "=== ${result} ==="
            cat "$result"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark-results
          path: evaluation/results/ci/*.json

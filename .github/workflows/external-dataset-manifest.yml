name: External benchmark dataset revision manifest
on:
  push:
    branches: [eval/external-dataset-manifest]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dataset_manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub>=0.26"
      - name: Verify dataset metadata and versions
        run: python scripts/external_dataset_manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-dataset-revisions
          path: results/external_dataset_manifest.json

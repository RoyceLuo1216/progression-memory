name: qa-benchmarks

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/progression_memory/evaluation/qa.py'
      - 'src/progression_memory/benchmarks/qa_benchmark.py'
      - 'src/progression_memory/evaluation/dag_retrieval.py'
      - 'src/progression_memory/evaluation/two_stage.py'
      - 'src/progression_memory/benchmarks/real_retrieval.py'
      - 'tests/test_qa.py'
      - '.github/workflows/qa-benchmarks.yml'

jobs:
  qa-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest -q
      - name: Download public benchmarks
        run: |
          mkdir -p evaluation/data evaluation/results/qa evaluation/results/qa/hypotheses
          wget -q https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json -O evaluation/data/locomo10.json
          wget -q https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json -O evaluation/data/longmemeval_s_cleaned.json
      - name: Run LoCoMo QA ablation
        run: |
          python -m progression_memory.benchmarks.qa_benchmark \
            --dataset locomo \
            --data-path evaluation/data/locomo10.json \
            --systems append,two_stage_v2,dag_two_stage_v2 \
            --char-budget 4800 \
            --sample-size 180 \
            --output evaluation/results/qa/locomo_qa.json
      - name: Run LongMemEval QA ablation
        run: |
          python -m progression_memory.benchmarks.qa_benchmark \
            --dataset longmemeval \
            --data-path evaluation/data/longmemeval_s_cleaned.json \
            --systems append,two_stage_v2,dag_two_stage_v2 \
            --char-budget 100000 \
            --sample-size 180 \
            --hypotheses-dir evaluation/results/qa/hypotheses \
            --output evaluation/results/qa/longmemeval_qa.json
      - name: Print QA summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('evaluation/results/qa').glob('*_qa.json')):
              data = json.loads(path.read_text())
              print(f'=== {path} ===')
              for system, result in data['results'].items():
                  print(system, json.dumps(result['overall'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qa-benchmark-results
          path: |
            evaluation/results/qa/*.json
            evaluation/results/qa/hypotheses/*.jsonl

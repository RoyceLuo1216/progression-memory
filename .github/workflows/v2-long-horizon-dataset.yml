name: V2 Long Horizon Dataset
on:
  push:
    branches: [v2/long-horizon-dataset]
  pull_request:
    paths:
      - 'src/progression_memory/benchmarks/v2_long_horizon_dataset.py'
      - 'tests/test_v2_long_horizon_dataset.py'
      - '.github/workflows/v2-long-horizon-dataset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_v2_long_horizon_dataset.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - run: ruff check src/progression_memory/benchmarks/v2_long_horizon_dataset.py tests/test_v2_long_horizon_dataset.py

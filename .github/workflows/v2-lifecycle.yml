name: V2 Lifecycle Policy
on:
  push:
    branches: [v2/lifecycle-policy]
  pull_request:
    paths:
      - 'src/progression_memory/v2/**'
      - 'tests/test_v2_lifecycle.py'
      - '.github/workflows/v2-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - run: ruff check src/progression_memory/v2 tests/test_v2_lifecycle.py

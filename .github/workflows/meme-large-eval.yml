name: MEME pinned schema probe
on:
  push:
    branches: [eval/meme-large-scale]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install huggingface_hub
      - run: python scripts/meme_schema_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: meme-schema-probe
          path: results/meme_schema_probe.json

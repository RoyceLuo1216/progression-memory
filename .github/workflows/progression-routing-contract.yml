name: progression-routing-contract

on:
  push:
    branches: [master]
    paths:
      - 'evaluation/data/progression_routing/**'
      - 'tests/test_career_school_routing_trace.py'
      - '.github/workflows/progression-routing-contract.yml'
  workflow_dispatch:

jobs:
  replay-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python evaluation/data/progression_routing/build_career_school_trace.py
      - run: git diff --exit-code -- evaluation/data/progression_routing/career_school_trace_v1.json
      - run: pytest -q tests/test_career_school_routing_trace.py

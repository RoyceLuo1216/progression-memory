name: V2 Planner Evaluation Harness
on:
  push:
    branches: [v2/longitudinal-planner-harness]
  pull_request:
    paths:
      - 'src/progression_memory/benchmarks/v2_planner_evaluation.py'
      - 'tests/test_v2_planner_evaluation.py'
      - '.github/workflows/v2-planner-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/progression_memory/benchmarks/v2_planner_evaluation.py tests/test_v2_planner_evaluation.py
      - run: python -m pytest -q tests/test_v2_planner_evaluation.py
      - name: Assert live inference is not misrepresented
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Credentials are configured but live inference is intentionally opt-in."
          else
            echo "No model credentials configured: offline validation only, no decision scores."
          fi

name: MEME Neural Hybrid and Adaptive Progression
on:
  push:
    branches: [eval/final-hybrid-memory]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install benchmark and real neural encoder
        run: |
          python -m pip install -e ".[dev]" huggingface_hub
          python -m pip install sentence-transformers==3.4.1 "transformers>=4.48,<5"
      - name: Validate adaptive memory controls
        run: python -m pytest -q tests/test_meme_final_hybrid.py
      - name: Run full 100-episode neural retrieval and adaptive memory
        env:
          OMP_NUM_THREADS: "2"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -u -m progression_memory.benchmarks.meme_final_hybrid --output results/meme_hybrid_100.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meme-hybrid-neural-full
          path: results/meme_hybrid_*.json

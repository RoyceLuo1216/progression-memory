name: V2 Adaptive Wiki and Progression Read
on:
  push:
    branches: [feature/adaptive-memory-read]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Temporal cutoff and hybrid fallback tests
        run: python -m pytest -q tests/test_v2_adaptive_read.py

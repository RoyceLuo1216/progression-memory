name: Qwen tiny four-arm decision comparison
on:
  push:
    branches: [v2/qwen35-small-model-smoke]
    paths:
      - scripts/qwen35_four_arm_tiny.py
      - .github/workflows/qwen35-four-arm-tiny.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tiny_four_arm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned-compatible Qwen runtime
        run: |
          python -m pip install -e .
          python -m pip install --no-cache-dir -U "transformers>=5.1.0" accelerate pillow torchvision
      - name: Actual shared Qwen planner four-arm run
        env:
          HF_HUB_DISABLE_XET: "1"
          OMP_NUM_THREADS: "2"
        run: python -m scripts.qwen35_four_arm_tiny
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen35-tiny-four-arm
          path: results/qwen35_four_arm_tiny.json

name: msc-progression-pair

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/msc-progression-pair.yml'
      - 'src/progression_memory/benchmarks/msc_progression_pair.py'
      - 'src/progression_memory/evaluation/representation_rag.py'
      - 'evaluation/data/progression_routing/msc_graph_expansion_v1.json'
      - 'tests/test_msc_progression_pair.py'
  workflow_dispatch:

jobs:
  paired-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[semantic,dev]'
      - run: pytest -q tests/test_msc_progression_pair.py tests/test_msc_graph_expansion.py
      - name: Fetch pinned official MSC corpus
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://parl.ai/downloads/msc/msc_v0.1.tar.gz -o "$RUNNER_TEMP/msc_v0.1.tar.gz"
          echo 'e640e37cf4317cd09fc02a4cd57ef130a185f23635f4003b0cee341ffcb45e60  '"$RUNNER_TEMP/msc_v0.1.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/msc"
          tar -xzf "$RUNNER_TEMP/msc_v0.1.tar.gz" -C "$RUNNER_TEMP/msc"
      - name: Replay held-out labels and run matched retrieval
        run: |
          corpus=$(find "$RUNNER_TEMP/msc" -path '*/msc_dialogue/session_2/train.txt' -print -quit)
          test -n "$corpus"
          root=$(dirname "$(dirname "$(dirname "$corpus")")")
          python -m progression_memory.benchmarks.msc_writer_development \
            --data-root "$root" --conversations 48 --output "$RUNNER_TEMP/msc-audit.json"
          python -m progression_memory.benchmarks.msc_progression_pair \
            --audit "$RUNNER_TEMP/msc-audit.json" \
            --traces evaluation/data/progression_routing/msc_graph_expansion_v1.json \
            --semantic-model sentence-transformers/all-MiniLM-L6-v2 \
            --model-revision 1110a243fdf4706b3f48f1d95db1a4f5529b4d41 \
            --depths 1 3 5 --context-chars 4800 \
            --output evaluation/results/ci/msc-progression-pair.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msc-progression-pair
          path: evaluation/results/ci/msc-progression-pair.json
          if-no-files-found: warn

name: qa-controlled-baselines

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Questions per dataset (0 = full dataset)"
        required: true
        default: '180'
  push:
    branches: [master]
    paths:
      - 'src/progression_memory/benchmarks/qa_benchmark.py'
      - 'src/progression_memory/benchmarks/baseline_retrieval.py'
      - 'tests/test_qa.py'
      - '.github/workflows/qa-controlled-baselines.yml'

jobs:
  shared-reader-qa:
    strategy:
      fail-fast: false
      matrix:
        dataset: [locomo, longmemeval]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Test shared source-level and QA pipeline
        run: pytest -q tests/test_qa.py tests/test_baseline_retrieval.py
      - name: Download and verify dataset
        run: |
          mkdir -p evaluation/data evaluation/results/ci/qa-controlled
          if [ '${{ matrix.dataset }}' = locomo ]; then
            curl -fsSL --retry 3 https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json -o evaluation/data/locomo10.json
            echo '79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4  evaluation/data/locomo10.json' | sha256sum -c -
          else
            curl -fsSL --retry 3 https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json -o evaluation/data/longmemeval_s_cleaned.json
            echo 'd6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442  evaluation/data/longmemeval_s_cleaned.json' | sha256sum -c -
          fi
      - name: Evaluate every implemented baseline with one reader
        env:
          PYTHONPATH: src
          REQUESTED_SAMPLE: ${{ inputs.sample_size }}
        run: |
          if [ '${{ matrix.dataset }}' = locomo ]; then
            data=evaluation/data/locomo10.json
            budget=4800
          else
            data=evaluation/data/longmemeval_s_cleaned.json
            budget=100000
          fi
          sample="${REQUESTED_SAMPLE:-180}"
          args=()
          if [ "$sample" != 0 ]; then args+=(--sample-size "$sample"); fi
          python -m progression_memory.benchmarks.qa_benchmark \
            --dataset '${{ matrix.dataset }}' --data-path "$data" \
            --char-budget "$budget" --reader multi_evidence_extractive \
            --context-strategy flat "${args[@]}" \
            --output 'evaluation/results/ci/qa-controlled/${{ matrix.dataset }}.json' \
            > 'evaluation/results/ci/qa-controlled/${{ matrix.dataset }}.stdout.json'
      - name: Print paired QA results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evaluation/results/ci/qa-controlled/${{ matrix.dataset }}.json').read_text())
          for system,row in data['results'].items():
              overall=row['overall']
              paired=data['paired_vs_append'].get(system,{})
              print(f"{system}: F1={overall['token_f1']:.4f} contains={overall['answer_contains']:.4f} evidence={overall['retrieval_recall']:.4f} paired={paired.get('delta',{})}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-controlled-${{ matrix.dataset }}
          path: evaluation/results/ci/qa-controlled/${{ matrix.dataset }}.json
          if-no-files-found: warn

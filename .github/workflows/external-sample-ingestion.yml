name: External memory benchmark sample ingestion
on:
  push:
    branches: [eval/external-sample-ingestion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample_schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=0.26' 'pyarrow>=15'
      - name: Download and inspect pinned samples
        run: python scripts/external_sample_ingestion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-sample-schema
          path: results/external_sample_schema.json

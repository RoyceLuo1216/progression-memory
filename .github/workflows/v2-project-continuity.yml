name: V2 Project Continuity Stress
on:
  push:
    branches: [v2/project-continuity-benchmark]
  pull_request:
    paths:
      - 'src/progression_memory/benchmarks/v2_project_continuity.py'
      - 'src/progression_memory/benchmarks/v2_project_stress.py'
      - 'tests/test_v2_project_continuity.py'
      - '.github/workflows/v2-project-continuity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/progression_memory/benchmarks/v2_project_continuity.py src/progression_memory/benchmarks/v2_project_stress.py tests/test_v2_project_continuity.py
      - run: python -m pytest -q tests/test_v2_project_continuity.py
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        distractors: [1, 4, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Run matched-budget stress
        run: python -m progression_memory.benchmarks.v2_project_stress --distractors ${{ matrix.distractors }} --output-dir results/stress-${{ matrix.distractors }}
      - uses: actions/upload-artifact@v4
        with:
          name: v2-project-stress-${{ matrix.distractors }}
          path: results/stress-${{ matrix.distractors }}/*.json

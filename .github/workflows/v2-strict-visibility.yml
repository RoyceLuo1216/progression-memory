name: V2 Strict Visible Evidence Stress
on:
  push:
    branches: [v2/visible-evidence-stress]
  pull_request:
    paths:
      - 'src/progression_memory/benchmarks/v2_strict_visibility.py'
      - 'tests/test_v2_strict_visibility.py'
      - '.github/workflows/v2-strict-visibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/progression_memory/benchmarks/v2_strict_visibility.py tests/test_v2_strict_visibility.py
      - run: python -m pytest -q tests/test_v2_strict_visibility.py
  strict_benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distractors: [1, 4, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m progression_memory.benchmarks.v2_strict_visibility --distractors ${{ matrix.distractors }} --output results/strict_${{ matrix.distractors }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: strict-visibility-${{ matrix.distractors }}
          path: results/strict_${{ matrix.distractors }}.json
